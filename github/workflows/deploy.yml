name: Deploy to GitHub Pages<br/><br/>on:<br/>  push:<br/>    branches: [main]<br/>  workflow_dispatch:<br/><br/>permissions:<br/>  contents: read<br/><br/>jobs:<br/>  build:<br/>    runs-on: ubuntu-latest<br/>    steps:<br/>      - name: Check out repository<br/>        uses: actions/checkout@v4<br/><br/>      - name: Set up Node<br/>        uses: actions/setup-node@v4<br/>        with:<br/>          node-version: 22<br/>          cache: npm<br/><br/>      - name: Install dependencies<br/>        run: npm ci --no-audit --no-fund --legacy-peer-deps<br/><br/>      - name: Build site<br/>        run: npm run build -- --base=/codex/<br/><br/>      - name: Upload site<br/>        uses: actions/upload-pages-artifact@v3<br/>        with:<br/>          path: ./dist<br/><br/>  deploy:<br/>    needs: build<br/>    runs-on: ubuntu-latest<br/>    permissions:<br/>      pages: write<br/>      id-token: write<br/>    environment:<br/>      name: github-pages<br/>      url: ${{ steps.deployment.outputs.page_url }}<br/>    steps:<br/>      - name: Deploy to GitHub Pages<br/>        id: deployment<br/>        uses: actions/deploy-pages@v4
